[project]
name = "bukang"
version = "0.1.0"
description = "부캉이가 만들어주는 컨테이너 런타임"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
bukang = "bukang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bukang"]
